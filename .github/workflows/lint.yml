name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Ty (informational)
        run: uv run ty check livelossplot
        continue-on-error: true
